<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Book Constellation">
  <defs>
    <linearGradient id="a" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0a6ff"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dffce"/><stop offset="1" stop-color="#f0a6ff"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#060d1f"/>
  <!-- constellation rising from the pages -->
  <g fill="none" stroke="url(#b)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 27 L26 13 L37 19 L47 9"/>
    <path d="M26 13 L32 27 L47 9" opacity=".75"/>
  </g>
  <g filter="url(#g)">
    <circle cx="17" cy="27" r="3.2" fill="#7dffce"/><circle cx="26" cy="13" r="3.6" fill="#ffffff"/>
    <circle cx="37" cy="19" r="3" fill="#a78bfa"/><circle cx="47" cy="9" r="3.4" fill="#f0a6ff"/>
    <circle cx="32" cy="27" r="2.6" fill="#6ee7ff"/>
  </g>
  <!-- open book, lower half -->
  <g fill="none" stroke="url(#a)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 35 C18 30.5, 26 30.5, 32 36.5 C38 30.5, 46 30.5, 54 35 L54 50 C46 45.5, 38 45.5, 32 51.5 C26 45.5, 18 45.5, 10 50 Z"/>
    <path d="M32 36.5 L32 51.5"/>
  </g>
</svg>
